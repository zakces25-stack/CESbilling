<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CES Flex — Client Portal</title>
<!-- Tighter than flex.html: no frame-src blob:/data:, no wss: listed.
     NOTE: CSP scheme matching means `https://*.supabase.co` also permits
     wss:// to that host, so this is NOT a websocket block. What actually keeps
     the broker portal's live cursors out of this page is (a) no realtime code
     here at all and (b) the flex_cursors_team_only policy on
     realtime.messages, which gates that topic on is_flex_team(). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Palette. Contrast-checked against WCAG AA (4.5:1 body, 3:1 large) before
   use — the flex.html tokens are not all safe as text on white:
     grey-500  #767c85  4.21:1  FAIL body   → secondary text uses grey-700
     green-500 #9fbe1c  2.13:1  FAIL both   → fill only, never text
     positive-500 #2f9e44 3.45:1 FAIL body  → text uses positive-700
   Safe as text on white: navy-800 15.6, grey-700 10.6, green-700 4.96,
   positive-700 6.3, negative-500 4.99, info-500 4.67.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --font-display:'Archivo','Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;

  --navy-900:#0f1930; --navy-800:#16233f; --navy-700:#1f2d4d;
  --green-700:#5f7912; --green-600:#7fa017; --green-500:#9fbe1c;
  --positive-700:#1f6e30; --negative-600:#a63a31; --negative-500:#c2453b;
  --info-600:#26697f; --info-500:#2e7c9e;

  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8f9fb;
  --ink:#16233f; --ink-2:#3a3f47; --ink-3:#5a616b;
  --line:#dbe0e7; --line-strong:#c3cad4;
  --accent:var(--green-700); --accent-fill:var(--green-500);

  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-sm:0 1px 3px rgba(22,35,63,.08),0 1px 2px rgba(22,35,63,.04);
  --shadow-md:0 4px 10px rgba(22,35,63,.08),0 2px 4px rgba(22,35,63,.05);
  --shadow-lg:0 12px 28px rgba(22,35,63,.12),0 4px 8px rgba(22,35,63,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1424; --surface:#141d33; --surface-2:#1a2440;
    --ink:#eef1f7; --ink-2:#c2c9d6; --ink-3:#9aa4b5;
    --line:#26314d; --line-strong:#35426a;
    --green-700:#b6d232; --positive-700:#5fc47a;
    --negative-500:#f08b81; --negative-600:#f08b81; --info-500:#6fc2dd;
    --accent:#b6d232;
    --shadow-sm:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 4px 12px rgba(0,0,0,.45);
    --shadow-lg:0 14px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#141d33; --surface-2:#1a2440;
  --ink:#eef1f7; --ink-2:#c2c9d6; --ink-3:#9aa4b5;
  --line:#26314d; --line-strong:#35426a;
  --green-700:#b6d232; --positive-700:#5fc47a;
  --negative-500:#f08b81; --negative-600:#f08b81; --info-500:#6fc2dd;
  --accent:#b6d232;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 4px 12px rgba(0,0,0,.45);
  --shadow-lg:0 14px 32px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  /* 16px base, never below 14px anywhere: HIG desktop minimum is 10pt/13pt
     default; energy tables get misread at small sizes so we sit above it. */
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); font-weight:800; letter-spacing:-.01em; margin:0}
a{color:var(--accent)}
/* Every interactive target ≥44px tall (HIG mobile) — desktop minimum is 24px
   but a client portal gets used on tablets. */
button,.btn{min-height:44px; font-family:var(--font-body); font-size:15px; font-weight:600; cursor:pointer}
:focus-visible{outline:3px solid var(--info-500); outline-offset:2px; border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── LOGIN ───────────────────────────────────────────────────────────── */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--navy-900),var(--navy-700) 62%,#243a64);padding:24px}
.lg-card{width:100%;max-width:412px;background:var(--surface);border-radius:var(--r-lg);
  padding:32px 30px 26px;box-shadow:var(--shadow-lg)}
.lg-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.lg-head img{height:40px;width:auto}
.lg-head h1{font-size:20px;color:var(--ink)}
.lg-sub{font-size:13.5px;color:var(--ink-2);font-weight:600;margin-top:3px}
.lg-card label{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin:14px 0 6px}
.lg-card input{width:100%;min-height:46px;padding:11px 13px;border:1.5px solid var(--line-strong);
  border-radius:var(--r-sm);font-size:16px;font-family:var(--font-body);
  background:var(--surface);color:var(--ink)}
.lg-card input:focus{border-color:var(--info-500);outline:none;box-shadow:0 0 0 3px rgba(46,124,158,.22)}
#lgBtn{width:100%;margin-top:20px;background:var(--navy-800);color:#fff;border:0;
  border-radius:var(--r-sm);font-size:16px;font-weight:700}
#lgBtn:hover:not(:disabled){background:var(--navy-700)}
#lgBtn:disabled{opacity:.6;cursor:not-allowed}
.lg-ts{margin-top:16px;min-height:66px}
#lgErr{display:none;margin-top:14px;padding:10px 12px;background:#fdecea;border:1px solid #f5c6c2;
  border-radius:var(--r-sm);color:var(--negative-600);font-size:13.5px;font-weight:600}
.lg-note{margin-top:18px;font-size:13px;color:var(--ink-3);line-height:1.55}
.shake{animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.spin{width:26px;height:26px;margin:0 auto;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.shake{animation:none}}

/* ── APP SHELL ───────────────────────────────────────────────────────── */
#app{display:none;max-width:1240px;margin:0 auto;padding:0 20px 64px}
header#top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0 18px}
header#top img{height:34px}
.co{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.2}
.co small{display:block;font-family:var(--font-body);font-size:12.5px;font-weight:600;
  color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.gbtn{background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-2);
  border-radius:var(--r-sm);padding:0 15px}
.gbtn:hover{border-color:var(--ink-3);color:var(--ink)}

nav#tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:26px}
nav#tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-3);
  padding:11px 18px;margin-bottom:-2px;font-size:15.5px}
nav#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-fill);font-weight:700}
nav#tabs button:hover{color:var(--ink)}

/* ── CARDS / GRID ────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);padding:20px}
.card h3{font-size:17px;margin-bottom:2px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2)}
.tag.power{border-color:var(--info-500);color:var(--info-600)}
.tag.gas{border-color:var(--green-600);color:var(--green-700)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:14px;margin-top:16px}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--font-mono);font-size:19px;font-weight:600;margin-top:3px}
.stat .u{font-size:12.5px;color:var(--ink-3);font-weight:600}

/* Hedge bar. Never colour-only: the % is always written out beside it, so the
   information survives greyscale and colour-blindness. */
.bar{height:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent-fill)}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .pc{font-family:var(--font-mono);font-size:13.5px;font-weight:600;min-width:46px;text-align:right}

/* ── TABLES ──────────────────────────────────────────────────────────── */
.tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
caption{text-align:left;padding:14px 16px 0;font-size:13px;color:var(--ink-3);font-weight:600}
th,td{padding:10px 14px;font-size:14.5px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);font-size:12.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.num{text-align:right;font-family:var(--font-mono);font-weight:600}
.cur{background:rgba(159,190,28,.14)}
.cur td:first-child::after{content:' • current';font-family:var(--font-body);font-size:11px;
  font-weight:700;color:var(--green-700);letter-spacing:.03em}

/* ── REPORTS ─────────────────────────────────────────────────────────── */
.rlist{display:flex;flex-direction:column;gap:12px}
.ritem{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:16px 18px;text-align:left;width:100%;box-shadow:var(--shadow-sm)}
.ritem:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.ritem .kind{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink-2)}
.ritem .ti{flex:1;min-width:0}
.ritem .ti b{display:block;font-size:15.5px;font-weight:700}
.ritem .ti span{font-size:13px;color:var(--ink-3)}
.rbody{white-space:pre-wrap;font-size:15.5px;line-height:1.68;color:var(--ink);
  max-width:74ch;   /* HIG: keep line length readable */
  font-family:var(--font-body)}
#rptView{display:none}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:15px;
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-md)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
  background:var(--navy-800);color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;
  font-weight:600;box-shadow:var(--shadow-lg);transition:transform .22s;z-index:200;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ── PRINT = the "Download PDF" path ────────────────────────────────────
   Print-to-PDF rather than a generated file: the report is pasted text, and
   the browser's own PDF writer gives selectable text, real pagination and no
   extra library inside the CSP. */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--ink:#111;--ink-2:#333;--ink-3:#555;--line:#ccc}
  body{background:#fff;font-size:11.5pt}
  #login,#tabs,.top-r,#toast,.noprint{display:none !important}
  #app{display:block !important;max-width:none;padding:0}
  header#top{padding:0 0 12pt;border-bottom:1.5pt solid #333;margin-bottom:16pt}
  .rbody{max-width:none;font-size:11.5pt;line-height:1.55}
  .card,.tbwrap{box-shadow:none;border:1pt solid #ccc;break-inside:avoid}
  thead th{position:static}
  a[href]::after{content:''}
  @page{margin:16mm 15mm}
}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
<div id="login">
  <div class="lg-card" id="lgCard">
    <div class="lg-head">
      <img src="https://niadffxpxdohglcyagau.supabase.co/storage/v1/object/public/public-docs/ces_logo.png"
           alt="Commercial Energy Solutions" onerror="this.style.display='none'">
      <div><h1>Flex Portal</h1><div class="lg-sub">Client access &middot; your baskets &amp; reports</div></div>
    </div>

    <form id="lgForm" onsubmit="lgSubmit(event)">
      <label for="lgUser">Username</label>
      <input type="text" id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="lgPass">Password</label>
      <input type="password" id="lgPass" autocomplete="current-password" required>
      <div class="lg-ts"><div class="cf-turnstile" data-sitekey="0x4AAAAAADVk1PbXl4rZN4aL"
           data-theme="auto" data-callback="_tsOk" data-expired-callback="_tsExp"></div></div>
      <button id="lgBtn" type="submit">Sign in</button>
      <div id="lgErr" role="alert"></div>
    </form>

    <div id="lgWait" style="display:none;text-align:center;padding:12px 0 4px">
      <div class="spin"></div>
      <p style="font-size:14px;color:var(--ink-2);font-weight:600;margin:14px 0 0">Loading your baskets&hellip;</p>
    </div>

    <div id="lgDenied" style="display:none;font-size:14px;color:var(--ink-2);line-height:1.6">
      <p style="margin:0 0 12px" id="lgDeniedMsg">You're signed in, but this account isn't set up for flex client access yet.</p>
      <p id="lgDeniedDetail" style="margin:0 0 12px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)"></p>
      <p style="margin:0"><button class="gbtn" id="lgRetry" onclick="lgRetry()"
           style="display:none;margin-right:8px">Try again</button>
        <a href="#" onclick="CX.sb.auth.signOut().then(()=>location.reload());return false">Sign out</a></p>
    </div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────────────── -->
<div id="app">
  <header id="top">
    <img src="https://niadffxpxdohglcyagau.supabase.co/storage/v1/object/public/public-docs/ces_logo.png"
         alt="Commercial Energy Solutions" onerror="this.style.display='none'">
    <div class="co" id="coName">—<small>Flex portal</small></div>
    <div class="top-r">
      <button class="gbtn" id="themeBtn" onclick="cxTheme()" aria-label="Switch between light and dark">Dark</button>
      <button class="gbtn" onclick="cxReload()">Refresh</button>
      <button class="gbtn" onclick="CX.sb.auth.signOut().then(()=>location.reload())">Sign out</button>
    </div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-baskets" aria-selected="true"  aria-controls="v-baskets" onclick="cxTab('baskets')">Baskets</button>
    <button role="tab" id="tab-reports" aria-selected="false" aria-controls="v-reports" onclick="cxTab('reports')">Reports</button>
    <button role="tab" id="tab-curve"   aria-selected="false" aria-controls="v-curve"   onclick="cxTab('curve')">Market curve</button>
  </nav>

  <section id="v-baskets" role="tabpanel" aria-labelledby="tab-baskets"></section>
  <section id="v-reports" role="tabpanel" aria-labelledby="tab-reports" hidden></section>
  <section id="v-curve"   role="tabpanel" aria-labelledby="tab-curve"   hidden></section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CES Flex — client portal.

   Read-only by construction, not by convention:
     · reads only flex_client_baskets / flex_client_positions /
       flex_client_curves / flex_reports — never the flex_* base tables
     · no insert / update / delete call exists anywhere in this file
     · no .channel() / realtime / presence anywhere in this file, and the
       flex-cursors topic is gated on is_flex_team() by an RLS policy on
       realtime.messages, so the broker portal's live cursors cannot appear
       here and cannot be subscribed to with this page's key either
     · its own auth storageKey, so a client session and a broker session can
       coexist in one browser without clobbering each other
   ═══════════════════════════════════════════════════════════════════════ */
const CX = (() => {
  const SB_URL = 'https://niadffxpxdohglcyagau.supabase.co';   // not `URL` — that shadows the global constructor
  const ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pYWRmZnhweGRvaGdsY3lhZ2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Mzc3MTksImV4cCI6MjA5NDMxMzcxOX0.x22Zh9O408PGfcPZ6rgu-a4B7WTbyH8iyT_ysr-IfIs';
  const sb = supabase.createClient(SB_URL, ANON, {
    auth: { persistSession:true, storageKey:'ces-flexclient-auth', autoRefreshToken:true }
  });
  return { sb, company:'', customerId:'' };
})();

let D = { baskets:[], positions:{}, curve:{gas:null,power:null}, reports:[] };
let VIEW = 'baskets';

/* ── helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2  = v => v==null ? '—' : (+v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const n0  = v => v==null ? '—' : Math.round(+v).toLocaleString('en-GB');
// Not clamped to 0–100: a basket secured above its forecast baseload is exactly
// the thing a client needs to see, and rounding it down to "100.0%" would hide it.
// Only the bar WIDTH is clamped, because a div can't be 130% wide.
const pct = v => v==null ? '—' : ((+v)*100).toFixed(1)+'%';
const barW = v => v==null ? 0 : Math.max(0, Math.min(100, (+v)*100)).toFixed(1);

/* Month clock in UK time — the same rule the broker portal uses, so both
   agree on which month is "current". */
function monthKey(y,m){ let yy=y,mm=m; while(mm<1){mm+=12;yy--;} while(mm>12){mm-=12;yy++;}
  return yy+'-'+String(mm).padStart(2,'0')+'-01'; }
function nowMonth(){ const d=new Date(); return monthKey(d.getFullYear(), d.getMonth()+1); }
function nextMonth(){ const d=new Date(); return monthKey(d.getFullYear(), d.getMonth()+2); }
function fmtMonth(s){ if(!s) return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z')
    .toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'}).replace(' ','-'); }
function fmtDate(s){ if(!s) return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z')
    .toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }

function cxTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark'
    : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? 'Dark' : 'Light';
  try { localStorage.setItem('ces-flexclient-theme', dark ? 'light' : 'dark'); } catch(e){}
}
(function(){ try{ const t=localStorage.getItem('ces-flexclient-theme');
  if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){} })();

/* ── login ───────────────────────────────────────────────────────────── */
window._tsOk  = t => { window._ts = t; };
window._tsExp = () => { window._ts = null; };

async function lgSubmit(ev){
  ev.preventDefault();
  const err = document.getElementById('lgErr'); err.style.display='none';
  let u = document.getElementById('lgUser').value.trim();
  if (u && u.indexOf('@') === -1) u += '@portal.cesgb.com';
  const p = document.getElementById('lgPass').value;
  const tok = window._ts || (window.turnstile && turnstile.getResponse && turnstile.getResponse()) || '';
  if (!tok){ err.textContent = 'Please complete the human-verification check.'; err.style.display='block'; return; }

  const btn = document.getElementById('lgBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await CX.sb.auth.signInWithPassword({ email:u, password:p, options:{ captchaToken:tok } });
  if (error){
    btn.disabled = false; btn.textContent = 'Sign in';
    if (window.turnstile && turnstile.reset){ turnstile.reset(); window._ts = null; }
    err.textContent = 'Sign-in failed — check your details and try again.'; err.style.display='block';
    const c = document.getElementById('lgCard');
    c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    return;
  }
  document.getElementById('lgForm').style.display='none';
  document.getElementById('lgWait').style.display='block';
  start();
}

// Two different situations that must not look the same to the client:
//   'noaccess' — signed in, but no baskets are mapped to them. Real and final.
//   'error'    — a query failed. Transient until proven otherwise, so it says so
//                and offers a retry instead of implying their account is wrong.
function denied(reason, detail){
  document.getElementById('lgForm').style.display='none';
  document.getElementById('lgWait').style.display='none';
  document.getElementById('lgDenied').style.display='block';
  const msg = document.getElementById('lgDeniedMsg');
  const det = document.getElementById('lgDeniedDetail');
  const rty = document.getElementById('lgRetry');
  if (reason === 'error'){
    msg.textContent = 'We could not load your portfolio just now. This is usually temporary.';
    det.textContent = detail ? String(detail).slice(0,160) : '';
    rty.style.display = '';
  } else {
    msg.textContent = "You're signed in, but no baskets have been shared with this account yet.";
    det.textContent = '';
    rty.style.display = 'none';
  }
}
function lgRetry(){
  document.getElementById('lgDenied').style.display='none';
  document.getElementById('lgWait').style.display='block';
  start();
}

/* ── load ────────────────────────────────────────────────────────────── */
async function load(){
  const [bk, ps, cv, rp, me] = await Promise.all([
    CX.sb.from('flex_client_baskets').select('id,name,commodity,unit_vol,unit_price').order('name'),
    CX.sb.from('flex_client_positions')
         .select('basket_id,month,season,days,baseload_vol,baseload_vol_total,secured_vol,secured_vol_total,secured_wap,secured_pct,open_vol,open_vol_total,open_pct,market_price')
         .order('month'),
    CX.sb.from('flex_client_curves').select('commodity,period_type,period_label,month,mid,updated_at'),
    CX.sb.from('flex_reports').select('id,kind,title,period_label,report_date,body,updated_at')
         .eq('published', true).order('report_date',{ascending:false}),
    CX.sb.from('customers').select('customer_id,company_name').maybeSingle()
  ]);
  for (const r of [bk, ps, cv, rp]) if (r.error) throw new Error(r.error.message);

  D.baskets = bk.data || [];
  D.positions = {};
  for (const r of (ps.data || [])) (D.positions[r.basket_id] ??= []).push(r);

  const fwd = nextMonth();
  const grp = (f,t) => (cv.data||[])
    .filter(c => c.commodity===f && c.period_type===t && (t!=='month' || !c.month || String(c.month).slice(0,10) >= fwd))
    .map(c => ({ label:c.period_label, month:c.month, mid:c.mid==null?null:+c.mid }));
  D.curve = { updated:(cv.data||[]).map(c=>c.updated_at).filter(Boolean).sort().pop(),
    gas:   { months:grp('gas','month'),   quarters:grp('gas','quarter'),   seasons:grp('gas','season'),   annuals:grp('gas','annual') },
    power: { months:grp('power','month'), quarters:grp('power','quarter'), seasons:grp('power','season'), annuals:grp('power','annual') } };

  D.reports = rp.data || [];
  // Company name is cosmetic — a failure here degrades the header, it does not
  // block the portal, so it is checked separately from the four above.
  if (me.error) console.warn('company name unavailable:', me.error.message);
  CX.company    = (me.data && me.data.company_name) || '';
  CX.customerId = (me.data && me.data.customer_id)  || '';
}

async function start(){
  try { await load(); }
  catch(e){ console.error(e); denied('error', e && e.message); return; }
  if (!D.baskets.length){ denied('noaccess'); return; }

  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display   = 'block';
  document.getElementById('coName').innerHTML =
    esc(CX.company || 'Your portfolio') + '<small>CES flex portal</small>';
  const dark = (document.documentElement.getAttribute('data-theme') || '') === 'dark'
    || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  document.getElementById('themeBtn').textContent = dark ? 'Light' : 'Dark';
  render();
}

async function cxReload(){ try { await load(); render(); toast('Up to date'); }
  catch(e){ toast('Could not refresh — please try again'); } }

/* ── tabs ────────────────────────────────────────────────────────────── */
function cxTab(v){
  VIEW = v;
  for (const k of ['baskets','reports','curve']){
    document.getElementById('tab-'+k).setAttribute('aria-selected', String(k===v));
    document.getElementById('v-'+k).hidden = (k!==v);
  }
  render();
}

function render(){
  if (VIEW==='baskets') renderBaskets();
  if (VIEW==='reports') renderReports();
  if (VIEW==='curve')   renderCurve();
}

/* ── baskets ─────────────────────────────────────────────────────────── */
// Forward cover = secured vs baseload across months from the current month on.
// Settled months are excluded: a client asking "how covered am I" means ahead.
function coverOf(rows){
  const from = nowMonth();
  let base=0, sec=0, wsum=0;
  for (const r of rows){
    if (!r.month) continue;                              // never silently counted
    if (String(r.month).slice(0,10) < from) continue;
    const b = +(r.baseload_vol_total||0), s = +(r.secured_vol_total||0);
    base += b; sec += s;
    if (r.secured_wap != null) wsum += s * (+r.secured_wap);
  }
  return { base, sec, pct: base ? sec/base : null, wap: sec ? wsum/sec : null };
}

function renderBaskets(){
  const el = document.getElementById('v-baskets');
  if (!D.baskets.length){ el.innerHTML = '<div class="empty">No baskets are shared with your account yet.</div>'; return; }

  el.innerHTML = `<div class="grid">${D.baskets.map(b=>{
    const rows = D.positions[b.id] || [];
    const c = coverOf(rows);
    const isP = b.commodity === 'power';
    return `<article class="card">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0"><h3>${esc(b.name)}</h3>
          <span class="tag ${isP?'power':'gas'}">${isP?'Electricity':'Gas'}</span></div>
      </div>
      <div style="margin-top:16px">
        <div class="stat"><span class="k">Forward cover</span></div>
        <div class="barrow" style="margin-top:6px">
          <div class="bar" style="flex:1"><i style="width:${barW(c.pct)}%"></i></div>
          <span class="pc">${pct(c.pct)}</span>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Secured</div>
          <div class="v">${n0(c.sec)}</div><div class="u">${isP?'MWh':'therms'}</div></div>
        <div class="stat"><div class="k">Forecast</div>
          <div class="v">${n0(c.base)}</div><div class="u">${isP?'MWh':'therms'}</div></div>
        <div class="stat"><div class="k">Secured WAP</div>
          <div class="v">${n2(c.wap)}</div><div class="u">${esc(b.unit_price||'')}</div></div>
      </div>
      <button class="gbtn" style="width:100%;margin-top:18px" data-basket="${esc(b.id)}">
        View month by month</button>
    </article>`;
  }).join('')}</div>`;
  // Delegated listener rather than onclick="openBasket('...')". An attribute is
  // HTML-decoded before its contents are parsed as JS, so esc()'s &#39; would
  // come back as a live quote and break out of the string. Ids are slugs today,
  // but a data attribute removes the whole class of bug.
  el.querySelectorAll('[data-basket]').forEach(btn =>
    btn.addEventListener('click', () => openBasket(btn.dataset.basket)));
}

function openBasket(id){
  const b = D.baskets.find(x=>x.id===id); if(!b) return;
  const rows = (D.positions[id] || []).slice().sort((x,y)=>String(x.month)<String(y.month)?-1:1);
  const isP = b.commodity==='power';
  const now = nowMonth();
  const c = coverOf(rows);

  document.getElementById('v-baskets').innerHTML = `
    <button class="gbtn noprint" onclick="renderBaskets()" style="margin-bottom:18px">&larr; All baskets</button>
    <div class="card" style="margin-bottom:20px">
      <h3>${esc(b.name)}</h3>
      <span class="tag ${isP?'power':'gas'}">${isP?'Electricity':'Gas'}</span>
      <div class="stats">
        <div class="stat"><div class="k">Forward cover</div><div class="v">${pct(c.pct)}</div></div>
        <div class="stat"><div class="k">Secured WAP</div><div class="v">${n2(c.wap)}</div>
          <div class="u">${esc(b.unit_price||'')}</div></div>
        <div class="stat"><div class="k">Months shown</div><div class="v">${rows.length}</div></div>
      </div>
    </div>
    <div class="tbwrap">
      <table>
        <caption>Volumes in ${isP?'MWh':'therms'}; rates in ${esc(b.unit_price||'')}.
          Market price is the live forward curve for that month, or its season where no month price exists.</caption>
        <thead><tr>
          <th scope="col">Month</th><th scope="col">Season</th>
          <th scope="col" class="num">Forecast</th><th scope="col" class="num">Secured</th>
          <th scope="col" class="num">Cover</th><th scope="col" class="num">Secured WAP</th>
          <th scope="col" class="num">Open</th><th scope="col" class="num">Market</th>
        </tr></thead>
        <tbody>${rows.map(r=>{
          const mk = String(r.month).slice(0,10);
          return `<tr${mk===now?' class="cur"':''}>
            <td>${fmtMonth(r.month)}</td><td>${esc(r.season||'')}</td>
            <td class="num">${n0(r.baseload_vol_total)}</td>
            <td class="num">${n0(r.secured_vol_total)}</td>
            <td class="num">${pct(r.secured_pct)}</td>
            <td class="num">${n2(r.secured_wap)}</td>
            <td class="num">${n0(r.open_vol_total)}</td>
            <td class="num">${n2(r.market_price)}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── reports ─────────────────────────────────────────────────────────── */
function renderReports(){
  const el = document.getElementById('v-reports');
  if (!D.reports.length){
    el.innerHTML = '<div class="empty">No reports have been published to your portal yet.</div>'; return; }
  el.innerHTML = `<div class="rlist">${D.reports.map(r=>`
    <button class="ritem" data-report="${esc(r.id)}">
      <span class="kind">${esc(r.kind)}</span>
      <span class="ti"><b>${esc(r.title)}</b>
        <span>${esc(r.period_label || fmtDate(r.report_date))}</span></span>
      <span aria-hidden="true" style="color:var(--ink-3);font-size:20px">&rsaquo;</span>
    </button>`).join('')}</div>`;
  el.querySelectorAll('[data-report]').forEach(btn =>
    btn.addEventListener('click', () => openReport(btn.dataset.report)));
}

function openReport(id){
  const r = D.reports.find(x=>x.id===id); if(!r) return;
  document.getElementById('v-reports').innerHTML = `
    <button class="gbtn noprint" onclick="renderReports()" style="margin-bottom:18px">&larr; All reports</button>
    <article class="card">
      <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <span class="kind" style="font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">${esc(r.kind)} report</span>
          <h2 style="font-size:22px;margin:8px 0 4px">${esc(r.title)}</h2>
          <div style="font-size:13.5px;color:var(--ink-3);font-weight:600">
            ${esc(r.period_label || '')}${r.period_label?' · ':''}${fmtDate(r.report_date)}</div>
        </div>
        <button class="gbtn noprint" onclick="printReport()">Download PDF</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <div class="rbody">${esc(r.body)}</div>
    </article>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

// The report is pasted text, so the browser's own PDF writer is the right tool:
// selectable text, real pagination, nothing extra loaded into the page.
function printReport(){ toast('Choose "Save as PDF" in the print dialog'); setTimeout(()=>window.print(), 500); }

/* ── market curve ────────────────────────────────────────────────────── */
function renderCurve(){
  const el = document.getElementById('v-curve');
  const have = [...new Set(D.baskets.map(b=>b.commodity))];
  const row = (label, rows) => !rows || !rows.length ? '' : `
    <div class="tbwrap" style="margin-top:14px"><table style="min-width:520px">
      <thead><tr><th scope="col">${label}</th>${rows.map(r=>
        `<th scope="col" class="num">${esc(r.month?fmtMonth(r.month):r.label)}</th>`).join('')}</tr></thead>
      <tbody><tr><th scope="row">Mid</th>${rows.map(r=>
        `<td class="num">${n2(r.mid)}</td>`).join('')}</tr></tbody>
    </table></div>`;
  const block = (title, unit, d) => `<section class="card" style="margin-bottom:20px">
      <h3>${title} <span style="font-weight:600;color:var(--ink-3);font-size:14px">(${unit})</span></h3>
      ${row('Months',d.months)}${row('Quarters',d.quarters)}${row('Seasons',d.seasons)}${row('Annuals',d.annuals)}
    </section>`;

  el.innerHTML =
      (have.includes('power') ? block('UK Power Forward Curve','£/MWh', D.curve.power) : '')
    + (have.includes('gas')   ? block('NBP Gas Forward Curve','p/th',  D.curve.gas)   : '')
    + `<p style="font-size:13px;color:var(--ink-3);max-width:74ch">
         Indicative forward curve, upcoming months only — the current delivery month prices
         day-ahead and is not a forward period. Shown for information; it is not a tradeable quote.</p>`;
}

/* ── boot ────────────────────────────────────────────────────────────── */
(async function(){
  let s = null;
  try { ({ data:{ session:s } } = await CX.sb.auth.getSession()); } catch(e){}
  if (s){ document.getElementById('lgForm').style.display='none';
          document.getElementById('lgWait').style.display='block'; start(); }
})();
</script>
