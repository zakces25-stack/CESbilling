<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CES Flex — Client Portal</title>
<!-- This page had no icons, no manifest and no robots directive. index.html has
     had them all along; the client portal was the odd one out, so it showed a
     blank tab icon. Same asset paths as the billing portal. -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Tints the browser chrome to match whichever theme the client is in. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f3d7e">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0b1120">
<!-- A private client portal has no business in a search index. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private CES flex portal for client baskets and reports.">
<meta name="color-scheme" content="light dark">
<!-- NOTE on CSP: scheme matching means `https://*.supabase.co` also permits
     wss:// to that host, so this is NOT a websocket block. What keeps the broker
     portal's live cursors out of this page is (a) no realtime code here at all
     and (b) the flex_cursors_team_only policy on realtime.messages, which gates
     that topic on is_flex_team(). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Palette contrast-checked to WCAG AA before use. The flex.html tokens are not
   all safe as text on white: grey-500 4.21:1 FAIL, green-500 2.13:1 FAIL,
   positive-500 3.45:1 FAIL. Safe: navy-800 15.6, grey-700 10.6, green-700 4.96,
   positive-700 6.3, negative-500 4.99, info-500 4.67. */
:root{
  --font-display:'Archivo','Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --navy-900:#0f1930; --navy-800:#16233f; --navy-700:#1f2d4d;
  --green-700:#5f7912; --green-600:#7fa017; --green-500:#9fbe1c;
  --positive-700:#1f6e30; --negative-600:#a63a31; --negative-500:#c2453b;
  --info-600:#26697f; --info-500:#2e7c9e;
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8f9fb;
  --ink:#16233f; --ink-2:#3a3f47; --ink-3:#5a616b;
  --line:#dbe0e7; --line-strong:#c3cad4;
  --accent:var(--green-700); --accent-fill:var(--green-500);
  /* One modular type scale instead of the arbitrary 11.5/12.5/13.5/14.5/15.5
     sizes the first version drifted into. Consistent steps are what makes a
     dense screen scannable. */
  --t-xs:12px; --t-sm:13px; --t-base:14px; --t-md:16px;
  --t-lg:18px; --t-xl:22px; --t-2xl:28px;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-sm:0 1px 3px rgba(22,35,63,.08),0 1px 2px rgba(22,35,63,.04);
  --shadow-md:0 4px 10px rgba(22,35,63,.08),0 2px 4px rgba(22,35,63,.05);
  --shadow-lg:0 12px 28px rgba(22,35,63,.12),0 4px 8px rgba(22,35,63,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  /* Every colour below is re-stated for dark. The first version missed
     --info-600 and --green-600, so the Electricity tag rendered at 2.72:1 —
     unreadable. Measured on the card surface: ink 13.9, ink-2 10.3, ink-3 7.3,
     info-600 8.7, green-700 9.9, positive-700 8.6, negative-500 7.6. */
  --bg:#0b1120; --surface:#1b2540; --surface-2:#232f4f;
  --ink:#f2f5fa; --ink-2:#cdd5e2; --ink-3:#aab4c6;
  --line:#3d4c73; --line-strong:#55679a;
  --green-700:#c3dd45; --green-600:#c3dd45; --green-500:#aecb2a;
  --positive-700:#6fd88c; --negative-500:#ff9d92; --negative-600:#ff9d92;
  --info-500:#7fd0e8; --info-600:#7fd0e8; --accent:#c3dd45; --accent-fill:#aecb2a;
  --shadow-sm:0 1px 3px rgba(0,0,0,.45); --shadow-md:0 6px 16px rgba(0,0,0,.5);
  --shadow-lg:0 16px 36px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{
  /* Every colour below is re-stated for dark. The first version missed
     --info-600 and --green-600, so the Electricity tag rendered at 2.72:1 —
     unreadable. Measured on the card surface: ink 13.9, ink-2 10.3, ink-3 7.3,
     info-600 8.7, green-700 9.9, positive-700 8.6, negative-500 7.6. */
  --bg:#0b1120; --surface:#1b2540; --surface-2:#232f4f;
  --ink:#f2f5fa; --ink-2:#cdd5e2; --ink-3:#aab4c6;
  --line:#3d4c73; --line-strong:#55679a;
  --green-700:#c3dd45; --green-600:#c3dd45; --green-500:#aecb2a;
  --positive-700:#6fd88c; --negative-500:#ff9d92; --negative-600:#ff9d92;
  --info-500:#7fd0e8; --info-600:#7fd0e8; --accent:#c3dd45; --accent-fill:#aecb2a;
  --shadow-sm:0 1px 3px rgba(0,0,0,.45); --shadow-md:0 6px 16px rgba(0,0,0,.5);
  --shadow-lg:0 16px 36px rgba(0,0,0,.55);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;margin:0}
a{color:var(--accent)}
button,.btn{min-height:44px;font-family:var(--font-body);font-size:var(--t-md);font-weight:600;cursor:pointer}
:focus-visible{outline:3px solid var(--info-500);outline-offset:2px;border-radius:4px}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--navy-900),var(--navy-700) 62%,#243a64);color:#fff;
  flex-direction:column;gap:16px;z-index:100}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.28);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
#bootTxt{font-size:var(--t-base);font-weight:600;opacity:.92;text-align:center;padding:0 20px;max-width:460px}
#bootTxt a{color:#cfe06a}

#app{display:none;max-width:1280px;margin:0 auto;padding:0 20px 64px}
header#top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0 18px}
header#top img{height:34px}
.co{font-family:var(--font-display);font-weight:800;font-size:var(--t-lg);line-height:1.2}
.co small{display:block;font-family:var(--font-body);font-size:var(--t-xs);font-weight:600;
  color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gbtn{background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-2);
  border-radius:var(--r-sm);padding:0 15px}
.gbtn:hover{border-color:var(--ink-3);color:var(--ink)}

/* Wraps rather than scrolls. overflow-x:auto was painting a scrollbar stub in
   the corner of the tab row on Windows even with nothing to scroll. */
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:24px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-3);
  padding:11px 18px;margin-bottom:-2px;font-size:var(--t-md);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-fill);font-weight:700}
nav.tabs button:hover{color:var(--ink)}
nav.subtabs{margin-bottom:18px;border-bottom:1px solid var(--line)}
nav.subtabs button{font-size:var(--t-base);padding:9px 15px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);padding:20px}
.card h3{font-size:var(--t-lg);margin-bottom:2px}

/* The whole basket card is clickable, not just a small button inside it.
   Stretched-link pattern: a real <button> in the heading whose ::after covers
   the card. Keyboard and screen readers get a proper button; the mouse gets the
   whole card. A <button> wrapping the card would be invalid HTML, since a
   button may only contain phrasing content. */
.card.clickable{position:relative;transition:border-color .15s,box-shadow .15s,transform .15s}
.card.clickable:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card.clickable:has(.stretch:focus-visible){border-color:var(--accent);box-shadow:var(--shadow-md)}
.stretch{all:unset;cursor:pointer;font:inherit;color:inherit}
.stretch::after{content:'';position:absolute;inset:0;border-radius:inherit}
/* Focus ring sits on the button by default so it is never lost. Where :has() is
   supported the ring moves out to the whole card, which is the real target.
   Written in this order so a browser without :has() still shows a ring. */
.stretch:focus-visible{outline:3px solid var(--info-500);outline-offset:2px;border-radius:4px}
.card.clickable:has(.stretch:focus-visible){outline:3px solid var(--info-500);outline-offset:2px}
.card.clickable:has(.stretch:focus-visible) .stretch:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){.card.clickable{transition:none}.card.clickable:hover{transform:none}}
.cardgo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--line);
  font-size:var(--t-base);font-weight:700;color:var(--accent)}
.tag{display:inline-block;font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2)}
.tag.power{border-color:var(--info-500);color:var(--info-600)}
.tag.gas{border-color:var(--green-600);color:var(--green-700)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:14px;margin-top:16px}
.stat .k{font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--font-mono);font-size:var(--t-lg);font-weight:600;margin-top:3px}
.stat .u{font-size:var(--t-xs);color:var(--ink-3);font-weight:600}

/* Hedge bar is never colour-only: the % is written out beside it, so it still
   reads in greyscale and for colour-blind users. Cover is the headline number
   on this card, so it gets headline sizing rather than 13px. */
.bar{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent-fill)}
.barrow{display:flex;align-items:center;gap:12px}
.barrow .pc{font-family:var(--font-mono);font-size:var(--t-lg);font-weight:600;min-width:66px;
  text-align:right;color:var(--ink)}

.tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
caption{text-align:left;padding:14px 16px 0;font-size:var(--t-sm);color:var(--ink-3);font-weight:600;
  max-width:80ch;white-space:normal;line-height:1.5}
th,td{padding:11px 14px;font-size:var(--t-base);border-bottom:1px solid var(--line);
  text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);font-size:var(--t-xs);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);z-index:2}
tbody tr:last-child td{border-bottom:0}
/* Zebra striping. Dense financial rows are hard to track across 10 columns with
   hover alone, and hover does nothing on touch. */
tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
tbody tr:hover td{background:var(--surface-2)}

/* The month/ref column stays put while the numbers scroll under it. Without
   this you lose track of which row you are reading the moment you scroll right. */
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
thead th:first-child{z-index:3;background:var(--surface-2)}
tbody tr:nth-child(even) td:first-child{background:color-mix(in srgb, var(--surface) 100%, transparent)}
tbody tr:hover td:first-child{background:var(--surface-2)}
th:first-child::after,td:first-child::after{content:'';position:absolute;top:0;right:0;bottom:0;
  width:1px;background:var(--line)}

/* tabular-nums keeps digits the same width so columns line up down the page. */
.num{text-align:right;font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--positive-700)}
.neg{color:var(--negative-500)}
.cur{background:rgba(159,190,28,.14)}
.cur td{background:color-mix(in srgb, var(--accent-fill) 14%, transparent) !important}
.cur td:first-child::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-fill)}
.curtag{font-family:var(--font-body);font-size:var(--t-xs);font-weight:700;
  color:var(--accent);letter-spacing:.03em;margin-left:6px}
.hit{color:var(--positive-700);font-weight:700}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px;margin-bottom:18px}
.chartbox h4{margin:0 0 12px;font-family:var(--font-display);font-size:var(--t-md)}
.chartbox .cwrap{position:relative;height:300px}

.rlist{display:flex;flex-direction:column;gap:12px}
.ritem{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:16px 18px;text-align:left;width:100%;box-shadow:var(--shadow-sm)}
.ritem:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.kind{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink-2)}
.ritem .ti{flex:1;min-width:0}
.ritem .ti b{display:block;font-size:var(--t-md);font-weight:700}
.ritem .ti span{font-size:var(--t-sm);color:var(--ink-3)}
.rbody{white-space:pre-wrap;font-size:var(--t-md);line-height:1.68;color:var(--ink);max-width:74ch}

.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:var(--t-md);
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-md)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
  background:var(--navy-800);color:#fff;padding:12px 20px;border-radius:999px;font-size:var(--t-base);
  font-weight:600;box-shadow:var(--shadow-lg);transition:transform .22s;z-index:200;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}

@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--ink:#111;--ink-2:#333;--ink-3:#555;--line:#ccc}
  body{background:#fff;font-size:11.5pt}
  #boot,nav.tabs,nav.subtabs,.top-r,#toast,.noprint{display:none !important}
  #app{display:block !important;max-width:none;padding:0}
  header#top{padding:0 0 12pt;border-bottom:1.5pt solid #333;margin-bottom:16pt}
  .rbody{max-width:none;font-size:11.5pt;line-height:1.55}
  .card,.tbwrap,.chartbox{box-shadow:none;border:1pt solid #ccc;break-inside:avoid}
  thead th{position:static}
  @page{margin:16mm 15mm}
}
</style>
</head>
<body>

<div id="boot">
  <div class="spin"></div>
  <div id="bootTxt">Loading your portfolio&hellip;</div>
</div>

<div id="app">
  <header id="top">
    <img src="https://niadffxpxdohglcyagau.supabase.co/storage/v1/object/public/public-docs/ces_logo.png"
         alt="Commercial Energy Solutions" onerror="this.style.display='none'">
    <div class="co" id="coName">&mdash;<small>CES flex portal</small></div>
    <div class="top-r">
      <button class="gbtn" id="themeBtn" onclick="cxTheme()" aria-label="Switch between light and dark">Dark</button>
      <button class="gbtn" onclick="cxReload()">Refresh</button>
      <button class="gbtn" onclick="cxSignOut()">Sign out</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-baskets" aria-selected="true"  onclick="cxTab('baskets')">Baskets</button>
    <button role="tab" id="tab-reports" aria-selected="false" onclick="cxTab('reports')">Reports</button>
    <button role="tab" id="tab-curve"   aria-selected="false" onclick="cxTab('curve')">Market curve</button>
  </nav>

  <section id="v-baskets" role="tabpanel" aria-labelledby="tab-baskets"></section>
  <section id="v-reports" role="tabpanel" aria-labelledby="tab-reports" hidden></section>
  <section id="v-curve"   role="tabpanel" aria-labelledby="tab-curve"   hidden></section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CES Flex — client portal.

   NO LOGIN PAGE. flex.html is the single front door for staff and clients
   alike; it signs people in and bounces clients here. If this page is opened
   without a session it sends you straight back there, and signing out returns
   there too. Both pages share the ces-flex-auth storage key.

   Read-only by construction:
     · reads only flex_client_* views + flex_reports + own customers row
     · no insert / update / upsert / delete / rpc anywhere in this file
     · no .channel() / realtime / presence, and the flex-cursors topic is gated
       on is_flex_team() by an RLS policy, so broker cursors can neither appear
       here nor be subscribed to with this page's key
     · flex_notes is never queried and is unreachable to a client account
   ═══════════════════════════════════════════════════════════════════════ */
const LOGIN_PAGE = 'flex.html';

const CX = (() => {
  const SB_URL = 'https://niadffxpxdohglcyagau.supabase.co';
  const ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pYWRmZnhweGRvaGdsY3lhZ2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Mzc3MTksImV4cCI6MjA5NDMxMzcxOX0.x22Zh9O408PGfcPZ6rgu-a4B7WTbyH8iyT_ysr-IfIs';
  const sb = supabase.createClient(SB_URL, ANON, {
    auth:{ persistSession:true, storageKey:'ces-flex-auth', autoRefreshToken:true }
  });
  return { sb, company:'' };
})();

let D = { baskets:[], positions:{}, trades:{}, targets:{}, sites:{}, curve:{}, reports:[] };
let VIEW = 'baskets', OPEN = null, SUB = 'positions';
const CHARTS = {};

/* ── helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2 = v => v==null||v===''?'—':(+v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const n0 = v => v==null||v===''?'—':Math.round(+v).toLocaleString('en-GB');
const n4 = v => v==null||v===''?'—':(+v).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:4});
const money = v => v==null||v===''?'—':'£'+Math.round(+v).toLocaleString('en-GB');
// Not clamped: a basket secured above forecast is exactly what a client needs to
// see. Only the bar WIDTH is clamped, because a div can't be 130% wide.
const pct = v => v==null?'—':((+v)*100).toFixed(1)+'%';
const barW = v => v==null?0:Math.max(0,Math.min(100,(+v)*100)).toFixed(1);

// A percentage alone doesn't tell a client whether it is good. The word carries
// the meaning so it survives greyscale and colour-blindness; colour only backs
// it up. Thresholds are descriptive, not advice.
function coverLabel(p){
  if(p==null) return {t:'No forecast', c:'ink-3'};
  const v=+p*100;
  if(v>=99.5) return {t:'Fully covered',  c:'positive-700'};
  if(v>=66)   return {t:'Mostly covered', c:'positive-700'};
  if(v>=33)   return {t:'Part covered',   c:'ink-2'};
  if(v>0)     return {t:'Largely open',   c:'ink-2'};
  return {t:'Open', c:'ink-2'};
}
// Signed so the direction reads without colour.
function signed(v){
  if(v==null||v==='') return '<span>—</span>';
  const n=+v, s=(n>0?'+':n<0?'−':'')+'£'+Math.abs(Math.round(n)).toLocaleString('en-GB');
  return `<span class="${n>0?'pos':n<0?'neg':''}">${s}</span>`;
}
// SVG rather than a text glyph: scales with the type, inherits colour, and is
// hidden from screen readers so it is not read out as punctuation.
const ICON_ARROW='<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg>';
const ICON_CHEV='<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';

function monthKey(y,m){let yy=y,mm=m;while(mm<1){mm+=12;yy--;}while(mm>12){mm-=12;yy++;}
  return yy+'-'+String(mm).padStart(2,'0')+'-01';}
function nowMonth(){const d=new Date();return monthKey(d.getFullYear(),d.getMonth()+1);}
function nextMonth(){const d=new Date();return monthKey(d.getFullYear(),d.getMonth()+2);}
function fmtMonth(s){if(!s)return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'}).replace(' ','-');}
function fmtDate(s){if(!s)return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});}
function fmtLong(s){if(!s)return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600);}

function cxTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('themeBtn').textContent=dark?'Dark':'Light';
  try{localStorage.setItem('ces-flexclient-theme',dark?'light':'dark');}catch(e){}

}
(function(){try{const t=localStorage.getItem('ces-flexclient-theme');
  if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();

async function cxSignOut(){

/* ── load ────────────────────────────────────────────────────────────── */
async function load(){
  const [bk,ps,tr,tg,st,cv,rp,me] = await Promise.all([
    CX.sb.from('flex_client_baskets').select('id,name,commodity,unit_vol,unit_price').order('name'),
    CX.sb.from('flex_client_positions').select('*').order('month'),
    CX.sb.from('flex_client_trades').select('*').order('trade_date'),
    CX.sb.from('flex_client_targets').select('*').order('month'),
    CX.sb.from('flex_client_sites').select('*').order('mpxn'),
    CX.sb.from('flex_client_curves').select('commodity,period_type,period_label,month,mid,updated_at'),
    CX.sb.from('flex_reports').select('id,kind,title,period_label,report_date,body')
         .eq('published',true).order('report_date',{ascending:false}),
    CX.sb.from('customers').select('customer_id,company_name').maybeSingle()
  ]);
  for(const r of [bk,ps,tr,tg,st,cv,rp]) if(r.error) throw new Error(r.error.message);

  D.baskets = bk.data||[];
  const by = (rows,key)=>{const o={};for(const r of (rows||[]))(o[r[key]] ??= []).push(r);return o;};
  D.positions = by(ps.data,'basket_id');
  D.trades    = by(tr.data,'basket_id');
  D.targets   = by(tg.data,'basket_id');
  D.sites     = by(st.data,'basket_id');

  const fwd = nextMonth();
  const grp=(f,t)=>(cv.data||[])
    .filter(c=>c.commodity===f&&c.period_type===t&&(t!=='month'||!c.month||String(c.month).slice(0,10)>=fwd))
    .map(c=>({label:c.period_label,month:c.month,mid:c.mid==null?null:+c.mid}));
  D.curve = {
    gas:  {months:grp('gas','month'),  quarters:grp('gas','quarter'),  seasons:grp('gas','season'),  annuals:grp('gas','annual')},
    power:{months:grp('power','month'),quarters:grp('power','quarter'),seasons:grp('power','season'),annuals:grp('power','annual')}
  };
  D.reports = rp.data||[];
  if(me.error) console.warn('company name unavailable:', me.error.message);
  CX.company = (me.data && me.data.company_name) || '';
}

// A member of staff who lands here goes back to the broker portal rather than
// being told nothing is shared with them. Mirrors fxRouteClient() in flex.html:
// that one needs a non-null customer_id, this one needs a null one, so the two
// cannot ping-pong. ?r=1 caps it at one hop regardless.
async function routeStaff(session){
  if(new URLSearchParams(location.search).has('r')) return false;
  const uid = session && session.user ? session.user.id : null;
  if(!uid) return false;
  const { data:prof } = await CX.sb.from('profiles').select('customer_id').eq('id',uid).maybeSingle();
  if(!prof || prof.customer_id) return false;
  location.replace(LOGIN_PAGE+'?r=1');
  return true;
}

async function start(){
  const { data:{ session } } = await CX.sb.auth.getSession().catch(()=>({data:{session:null}}));
  if(!session){ location.replace(LOGIN_PAGE); return; }
  if(await routeStaff(session)) return;

  try{ await load(); }
  catch(e){
    console.error(e);
    bootMsg('We could not load your portfolio just now.<br><br>'
      + '<a href="#" onclick="location.reload();return false">Try again</a> &nbsp;·&nbsp; '
      + '<a href="#" onclick="cxSignOut();return false">Sign out</a>');
    return;
  }
  if(!D.baskets.length){
    bootMsg('You are signed in, but no baskets have been shared with this account yet.<br><br>'
      + 'Please contact your CES account manager. &nbsp;·&nbsp; '
      + '<a href="#" onclick="cxSignOut();return false">Sign out</a>');
    return;
  }

  document.getElementById('boot').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('coName').innerHTML = esc(CX.company||'Your portfolio')+'<small>CES flex portal</small>';
  const dark=(document.documentElement.getAttribute('data-theme')||'')==='dark'
    ||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  document.getElementById('themeBtn').textContent=dark?'Light':'Dark';
  render();
}

async function cxReload(){
  try{ await load(); render(); toast('Up to date'); }
  catch(e){ toast('Could not refresh — please try again'); }
}

/* ── basket list ─────────────────────────────────────────────────────── */
// Forward cover = secured vs baseload from the current month on. Settled months
// are excluded: "how covered am I" means ahead, not behind.
function coverOf(rows){
  const from=nowMonth();
  let base=0,sec=0,wsum=0,mtm=0;
  for(const r of rows||[]){
    if(!r.month) continue;
    if(String(r.month).slice(0,10)<from) continue;
    const b=+(r.baseload_vol_total||0), s=+(r.secured_vol_total||0);
    base+=b; sec+=s;
    if(r.secured_wap!=null) wsum+=s*(+r.secured_wap);
    mtm+=+(r.mtm_cost||0);
  }
  return {base,sec,mtm,pct:base?sec/base:null,wap:sec?wsum/sec:null};
}

  el.innerHTML=`<div class="grid">${D.baskets.map(b=>{
    const c=coverOf(D.positions[b.id]); const isP=b.commodity==='power';
    return `<article class="card clickable">
      <h3><button type="button" class="stretch" data-basket="${esc(b.id)}">${esc(b.name)}</button></h3>
      <span class="tag ${isP?'power':'gas'}">${isP?'Electricity':'Gas'}</span>
      <div style="margin-top:16px">
        <div class="stat" style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <span class="k">Forward cover</span>
          <span class="k" style="color:var(--${coverLabel(c.pct).c});text-transform:none;letter-spacing:0">${coverLabel(c.pct).t}</span>
        </div>
        <div class="barrow" style="margin-top:7px">
          <div class="bar" style="flex:1"><i style="width:${barW(c.pct)}%"></i></div>
          <span class="pc">${pct(c.pct)}</span></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Secured</div><div class="v">${n0(c.sec)}</div>
          <div class="u">${isP?'MWh':'therms'}</div></div>
        <div class="stat"><div class="k">Forecast</div><div class="v">${n0(c.base)}</div>
          <div class="u">${isP?'MWh':'therms'}</div></div>
        <div class="stat"><div class="k">Secured WAP</div><div class="v">${n2(c.wap)}</div>
          <div class="u">${esc(b.unit_price||'')}</div></div>
      </div>
      <span class="cardgo">Open basket ${ICON_ARROW}</span>
    </article>`;}).join('')}</div>`;
  // Delegated listeners rather than onclick="f('...')": an attribute is

  el.querySelectorAll('[data-basket]').forEach(b=>b.addEventListener('click',()=>{OPEN=b.dataset.basket;SUB='positions';render();}));

function subSeasons(b,host){
  const rows=(D.positions[b.id]||[]).slice().sort((x,y)=>String(x.month)<String(y.month)?-1:1);
  if(!rows.length){host.innerHTML='<div class="empty">No season data for this basket.</div>';return;}
  const isP=b.commodity==='power';
  const order=[],map={};
  for(const m of rows){const s=m.season||'Unknown';
    if(!map[s]){map[s]={name:s,months:[]};order.push(s);} map[s].months.push(m);}
  host.innerHTML=`<div class="tbwrap"><table>
    <caption>Grouped by delivery season. Volumes in ${isP?'MWh':'therms'}; rates in ${esc(b.unit_price||'')}.</caption>
    <thead><tr><th scope="col">Season</th><th scope="col" class="num">Months</th>
      <th scope="col" class="num">Forecast</th><th scope="col" class="num">Secured</th>
      <th scope="col" class="num">Cover</th><th scope="col" class="num">Secured WAP</th>
      <th scope="col" class="num">Secured cost</th><th scope="col" class="num">Mark to market</th>
    </tr></thead><tbody>${order.map(sn=>{
      const ms=map[sn].months;
      const base=ms.reduce((s,m)=>s+ +(m.baseload_vol_total||0),0);
      const sec =ms.reduce((s,m)=>s+ +(m.secured_vol_total||0),0);
      const cost=ms.reduce((s,m)=>s+ +(m.secured_cost||0),0);
      const mtm =ms.reduce((s,m)=>s+ +(m.mtm_cost||0),0);
      const wap = sec>0?cost/sec:null, cov = base>0?sec/base:null;
      return `<tr><td><strong>${esc(sn)}</strong></td><td class="num">${ms.length}</td>
        <td class="num">${n0(base)}</td><td class="num">${n0(sec)}</td>

        <td class="num">${money(cost)}</td><td class="num">${signed(mtm)}</td></tr>`;}).join('')}
    </tbody></table></div>`;
}

function subGraphs(b,host){

  CHARTS.cover=new Chart(document.getElementById('cCover'),{type:'bar',
    data:{labels,datasets:[{label:'Cover %',data:rows.map(r=>r.secured_pct==null?null:+(r.secured_pct)*100,),

    options:Object.assign({},base,{scales:{x:{grid:{color:grid}},
      y:{grid:{color:grid},beginAtZero:true,ticks:{callback:v=>v+'%'}}}})});

  CHARTS.price=new Chart(document.getElementById('cPrice'),{type:'line',
    data:{labels,datasets:[
      {label:'Secured WAP',data:rows.map(r=>r.secured_wap==null?null:+r.secured_wap),
       borderColor:css('--info-500')||'#2e7c9e',backgroundColor:'transparent',tension:.25,spanGaps:true},
      {label:'Market',data:rows.map(r=>r.market_price==null?null:+r.market_price),
       borderColor:css('--negative-500')||'#c2453b',backgroundColor:'transparent',
       borderDash:[5,4],tension:.25,spanGaps:true}]},
    options:Object.assign({},base,{scales:{x:{grid:{color:grid}},y:{grid:{color:grid},beginAtZero:false}}})});

  CHARTS.vol=new Chart(document.getElementById('cVol'),{type:'bar',
    data:{labels,datasets:[
      {label:'Secured',data:rows.map(r=>+(r.secured_vol_total||0)),backgroundColor:css('--accent-fill')||'#9fbe1c'},
      {label:'Forecast',data:rows.map(r=>+(r.baseload_vol_total||0)),backgroundColor:css('--line-strong')||'#c3cad4'}]},
    options:base});
}

/* ── reports ─────────────────────────────────────────────────────────── */
function renderReports(){
  const el=document.getElementById('v-reports');
  if(!D.reports.length){el.innerHTML='<div class="empty">No reports have been published to your portal yet.</div>';return;}
  el.innerHTML=`<div class="rlist">${D.reports.map(r=>`
    <button class="ritem" data-report="${esc(r.id)}">
      <span class="kind">${esc(r.kind)}</span>
      <span class="ti"><b>${esc(r.title)}</b><span>${esc(r.period_label||fmtLong(r.report_date))}</span></span>
      <span style="color:var(--ink-3);display:flex">${ICON_CHEV}</span>
    </button>`).join('')}</div>`;
  el.querySelectorAll('[data-report]').forEach(b=>b.addEventListener('click',()=>openReport(b.dataset.report)));
}
function openReport(id){
  const r=D.reports.find(x=>x.id===id); if(!r) return;
  const el=document.getElementById('v-reports');
  el.innerHTML=`<button class="gbtn noprint" id="rBack" style="margin-bottom:18px">&larr; All reports</button>
    <article class="card">
      <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <span class="kind">${esc(r.kind)} report</span>
          <h2 style="font-size:var(--t-xl);margin:8px 0 4px">${esc(r.title)}</h2>
          <div style="font-size:var(--t-sm);color:var(--ink-3);font-weight:600">
            ${esc(r.period_label||'')}${r.period_label?' · ':''}${fmtLong(r.report_date)}</div>
        </div>
        <button class="gbtn noprint" id="rPdf">Download PDF</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <div class="rbody">${esc(r.body)}</div>
    </article>`;
  document.getElementById('rBack').addEventListener('click',renderReports);
  // Pasted text, so the browser's own PDF writer is the right tool: selectable
  // text, real pagination, nothing extra loaded into the page.
  document.getElementById('rPdf').addEventListener('click',()=>{
    toast('Choose "Save as PDF" in the print dialog'); setTimeout(()=>window.print(),500);});
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── market curve ────────────────────────────────────────────────────── */
function renderCurve(){
  const el=document.getElementById('v-curve');
  const have=[...new Set(D.baskets.map(b=>b.commodity))];
  const row=(label,rows)=>!rows||!rows.length?'':`
    <div class="tbwrap" style="margin-top:14px"><table>
      <thead><tr><th scope="col">${label}</th>${rows.map(r=>
        `<th scope="col" class="num">${esc(r.month?fmtMonth(r.month):r.label)}</th>`).join('')}</tr></thead>
      <tbody><tr><th scope="row">Mid</th>${rows.map(r=>`<td class="num">${n2(r.mid)}</td>`).join('')}</tr></tbody>
    </table></div>`;
  const block=(t,u,d)=>`<section class="card" style="margin-bottom:20px">
      <h3>${t} <span style="font-weight:600;color:var(--ink-3);font-size:var(--t-base)">(${u})</span></h3>
      ${row('Months',d.months)}${row('Quarters',d.quarters)}${row('Seasons',d.seasons)}${row('Annuals',d.annuals)}
    </section>`;
  el.innerHTML=(have.includes('power')?block('UK Power Forward Curve','£/MWh',D.curve.power):'')
    +(have.includes('gas')?block('NBP Gas Forward Curve','p/th',D.curve.gas):'')
    +`<p style="font-size:var(--t-sm);color:var(--ink-3);max-width:74ch">
        Indicative forward curve, upcoming months only. The current delivery month prices day-ahead
        and is not a forward period. Shown for information; it is not a tradeable quote.</p>`;
}

start();
</script>
</body></html>
