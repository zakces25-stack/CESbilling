<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CES Flex — Client Portal</title>
<!-- This page had no icons, no manifest and no robots directive. index.html has
     had them all along; the client portal was the odd one out, so it showed a
     blank tab icon. Same asset paths as the billing portal. -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Tints the browser chrome to match whichever theme the client is in. -->
<meta name="theme-color" content="#0b1120">
<!-- A private client portal has no business in a search index. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private CES flex portal for client baskets and reports.">
<meta name="color-scheme" content="dark">
<!-- NOTE on CSP: scheme matching means `https://*.supabase.co` also permits
     wss:// to that host, so this is NOT a websocket block. What keeps the broker
     portal's live cursors out of this page is (a) no realtime code here at all
     and (b) the flex_cursors_team_only policy on realtime.messages, which gates
     that topic on is_flex_team(). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Palette contrast-checked to WCAG AA before use. The flex.html tokens are not
   all safe as text on white: grey-500 4.21:1 FAIL, green-500 2.13:1 FAIL,
   positive-500 3.45:1 FAIL. Safe: navy-800 15.6, grey-700 10.6, green-700 4.96,
   positive-700 6.3, negative-500 4.99, info-500 4.67. */
:root{
  --font-display:'Archivo','Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  /* One modular type scale instead of the arbitrary 11.5/12.5/13.5/14.5/15.5
     sizes the first version drifted into. Consistent steps are what makes a
     dense screen scannable. */
  --t-xs:12px; --t-sm:13px; --t-base:14px; --t-md:16px;
  --t-lg:18px; --t-xl:22px; --t-2xl:28px;
  /* Fluid display sizes. Fixed px everywhere is a tell that nobody tuned it. */
  --t-fig:clamp(20px, 1.1rem + 0.7vw, 26px);   /* the big figures on a card */
  --t-head:clamp(17px, 0.95rem + 0.5vw, 20px); /* basket / section headings */

  /* Sharp geometry. 12–24px radii on everything is the default look you get
     when nobody decides; precision instruments have tight corners. One step of
     3px, doubled. Pills are gone entirely except the toast, which is a pill on
     purpose because it floats and needs to read as transient. */
  --r-sm:3px; --r-md:6px; --r-lg:10px;

  /* Hairline-first. Shadows are reserved for things that genuinely float
     (the toast). Borders carry the structure, which is how print-derived
     financial layouts read as considered rather than decorated. */
  /* Dark only. There is no light theme and no toggle: this portal is read in
     meeting rooms and on laptops, the palette was tuned for dark, and a second
     theme is a second set of contrast bugs to maintain. Print still renders
     dark-on-white further down, because a printed report must not be a black page. */
  --navy-900:#0f1930; --navy-800:#16233f; --navy-700:#1f2d4d;
  --bg:#0b1120; --surface:#1b2540; --surface-2:#232f4f;
  --ink:#f2f5fa; --ink-2:#cdd5e2; --ink-3:#aab4c6;
  --line:#3d4c73; --line-strong:#55679a;
  --green-700:#c3dd45; --green-600:#c3dd45; --green-500:#aecb2a;
  --positive-700:#6fd88c; --negative-500:#ff9d92; --negative-600:#ff9d92;
  --info-500:#7fd0e8; --info-600:#7fd0e8;
  --accent:#c3dd45; --accent-fill:#aecb2a;
  --shadow-float:0 10px 30px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.022em;margin:0}
a{color:var(--accent)}
button,.btn{min-height:44px;font-family:var(--font-body);font-size:var(--t-md);font-weight:600;cursor:pointer}
:focus-visible{outline:3px solid var(--info-500);outline-offset:2px;border-radius:4px}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--navy-900),var(--navy-700) 62%,#243a64);color:#fff;
  flex-direction:column;gap:16px;z-index:100}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.28);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
#bootTxt{font-size:var(--t-base);font-weight:600;opacity:.92;text-align:center;padding:0 20px;max-width:460px}
#bootTxt a{color:#cfe06a}

#app{display:none;max-width:1280px;margin:0 auto;padding:0 20px 64px}
header#top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0 18px}
header#top img{height:34px}
.co{font-family:var(--font-display);font-weight:800;font-size:var(--t-lg);line-height:1.2}
.co small{display:block;font-family:var(--font-body);font-size:var(--t-xs);font-weight:600;
  color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gbtn{background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-2);
  border-radius:var(--r-sm);padding:0 15px}
.gbtn:hover{border-color:var(--ink-3);color:var(--ink)}

/* Wraps rather than scrolls. overflow-x:auto was painting a scrollbar stub in
   the corner of the tab row on Windows even with nothing to scroll. */
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:24px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-3);
  padding:11px 18px;margin-bottom:-2px;font-size:var(--t-md);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-fill);font-weight:700}
nav.tabs button:hover{color:var(--ink)}
nav.subtabs{margin-bottom:18px;border-bottom:1px solid var(--line)}
nav.subtabs button{font-size:var(--t-base);padding:9px 15px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--surface);/*opaque over backdrop*/border:1px solid var(--line);border-radius:var(--r-md);
  padding:20px}
.card h3{font-size:var(--t-head);margin-bottom:2px;line-height:1.25}

/* The whole basket card is clickable, not just a small button inside it.
   Stretched-link pattern: a real <button> in the heading whose ::after covers
   the card. Keyboard and screen readers get a proper button; the mouse gets the
   whole card. A <button> wrapping the card would be invalid HTML, since a
   button may only contain phrasing content. */
/* Deliberately NOT the float-up-on-hover pattern (a small negative vertical
   nudge plus a bigger soft shadow). That is the most recognisable AI-default
   interaction on the web, and on a card showing someone's energy spend it reads
   as decoration. Instead the card grows an accent rule down its leading edge:
   a print gesture, cheap to render, and it points at what you are about to open. */
.card.clickable{position:relative;overflow:hidden;
  transition:border-color .18s ease, background-color .18s ease}
.card.clickable::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);transform:scaleY(0);transform-origin:top;
  transition:transform .18s ease}
.card.clickable:hover{border-color:var(--line-strong);background:var(--surface-2)}
.card.clickable:hover::before{transform:scaleY(1)}
.card.clickable:has(.stretch:focus-visible){border-color:var(--line-strong)}
.card.clickable:has(.stretch:focus-visible)::before{transform:scaleY(1)}
.stretch{all:unset;cursor:pointer;font:inherit;color:inherit}
.stretch::after{content:'';position:absolute;inset:0;border-radius:inherit}
/* Focus ring sits on the button by default so it is never lost. Where :has() is
   supported the ring moves out to the whole card, which is the real target.
   Written in this order so a browser without :has() still shows a ring. */
.stretch:focus-visible{outline:3px solid var(--info-500);outline-offset:2px;border-radius:4px}
.card.clickable:has(.stretch:focus-visible){outline:3px solid var(--info-500);outline-offset:2px}
.card.clickable:has(.stretch:focus-visible) .stretch:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){
  .card.clickable,.card.clickable::before{transition:none}
  .card.clickable:hover::before{transform:scaleY(1)}}
.cardgo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--line);
  font-size:var(--t-base);font-weight:700;color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:var(--r-sm);border:1px solid currentColor;color:var(--ink-2)}
.tag.power{border-color:var(--info-500);color:var(--info-600)}
.tag.gas{border-color:var(--green-600);color:var(--green-700)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:14px;margin-top:16px}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--font-mono);font-size:var(--t-fig);font-weight:600;margin-top:4px;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .u{font-size:var(--t-xs);color:var(--ink-3);font-weight:600}

/* Hedge bar is never colour-only: the % is written out beside it, so it still
   reads in greyscale and for colour-blind users. Cover is the headline number
   on this card, so it gets headline sizing rather than 13px. */
.bar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent-fill)}
.barrow{display:flex;align-items:center;gap:12px}
.barrow .pc{font-family:var(--font-mono);font-size:var(--t-fig);font-weight:600;min-width:78px;
  text-align:right;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ── Stat header + filter bar ───────────────────────────────────────── */
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px;margin-bottom:18px}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px}
.statcard .l{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.statcard .v{font-family:var(--font-mono);font-size:var(--t-fig);font-weight:600;margin-top:5px;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.statcard .s{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:3px}

.filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;margin-bottom:16px}
.filters label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.filters select{font-family:var(--font-body);font-size:var(--t-base);font-weight:600;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:6px 9px;min-height:36px}
.filters .chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:var(--t-base);
  font-weight:600;color:var(--ink-2);text-transform:none;letter-spacing:0}
.filters input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent-fill);cursor:pointer}
.filters .count{margin-left:auto;font-size:var(--t-sm);color:var(--ink-3);font-weight:600}

/* ── Ambient scene ──────────────────────────────────────────────────────
   A generation landscape behind the page: turbines turning, smoke drifting,
   a price line climbing. Inline SVG rather than a photograph, so it is a few
   KB not a few hundred, stays crisp at any size, recolours with the theme and
   needs no image host inside the CSP.

   IT MUST NEVER COMPETE WITH THE NUMBERS. Fixed behind everything, very low
   opacity, cards and tables fully opaque on top, motion stopped under
   prefers-reduced-motion and when the tab is hidden. */
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
#scene svg{width:100%;height:100%;display:block}
#scene .sky{opacity:.55}
#scene .grid{stroke:var(--ink);opacity:.05;stroke-width:1;fill:none}
#scene .land{fill:var(--ink);opacity:.10}
#scene .mast{stroke:var(--ink);opacity:.22;fill:none;stroke-width:2.2}
#scene .pylon{stroke:var(--ink);opacity:.16;fill:none;stroke-width:1.6}
#scene .hub{fill:var(--ink);opacity:.30}
#scene .blade{stroke:var(--ink);opacity:.22;stroke-width:2.2;stroke-linecap:round}
#scene .stack{stroke:var(--ink);opacity:.18;fill:none;stroke-width:2}
#scene .puff{fill:var(--ink);opacity:0;animation:rise 9s ease-out infinite}
/* Candles carry their base opacity on the GROUP, not the rect, so the wave can
   modulate the whole candle without fighting a fixed rect opacity. */
/* Dense bar field. Base opacity lives on the GROUP so the wave can modulate the
   whole bar; the delay is proportional to its index, so a pulse of light runs
   left to right and then rests. No trend line: it competed with the bars and
   the bars are the point. */
#scene .cdl{opacity:.16;animation:wave 5.5s linear infinite;animation-delay:calc(var(--i) * .026s)}
#scene .cdl-dn rect{fill:var(--accent-fill)}
#scene .cdl-up rect{fill:var(--negative-500)}
#scene .vol{opacity:.10;animation:wave 5.5s linear infinite;animation-delay:calc(var(--i) * .026s)}
#scene .vol rect{fill:var(--ink)}
#scene .axis{stroke:var(--ink);opacity:.07;stroke-width:1;stroke-dasharray:3 6}
@keyframes rise{
  0%  {opacity:0;   transform:translate(0,0) scale(.35)}
  12% {opacity:.20}
  55% {opacity:.13; transform:translate(26px,-150px) scale(1.5)}
  100%{opacity:0;   transform:translate(64px,-330px) scale(2.9)}}
@keyframes flow{to{stroke-dashoffset:-1614}}
/* Mexican wave: each candle brightens a beat after the one to its left, so a
   pulse of light runs left to right along the curve and then rests. */
@keyframes wave{
  0%,62%{opacity:.16}
  72%{opacity:.85}
  82%{opacity:.16}
  100%{opacity:.16}}
@media (prefers-reduced-motion:reduce){
  #scene .puff,#scene .cdl,#scene .vol{animation:none}
  #scene .cdl{opacity:.16}
  #scene .vol{opacity:.10}
  #scene .puff{opacity:.10}}
#scene.paused .puff,#scene.paused .cdl,#scene.paused .vol{animation-play-state:paused}
#scene.paused animateTransform{display:none}

.tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
caption{text-align:left;padding:14px 16px 0;font-size:var(--t-sm);color:var(--ink-3);font-weight:600;
  max-width:80ch;white-space:normal;line-height:1.5}
th,td{padding:11px 14px;font-size:var(--t-base);border-bottom:1px solid var(--line);
  text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);font-size:11px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);z-index:2}
tbody tr:last-child td{border-bottom:0}
/* Zebra striping. Dense financial rows are hard to track across 10 columns with
   hover alone, and hover does nothing on touch. */
tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
tbody tr:hover td{background:var(--surface-2)}

/* The month/ref column stays put while the numbers scroll under it. Without
   this you lose track of which row you are reading the moment you scroll right. */
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
thead th:first-child{z-index:3;background:var(--surface-2)}
tbody tr:nth-child(even) td:first-child{background:color-mix(in srgb, var(--surface) 100%, transparent)}
tbody tr:hover td:first-child{background:var(--surface-2)}
th:first-child::after,td:first-child::after{content:'';position:absolute;top:0;right:0;bottom:0;
  width:1px;background:var(--line)}

/* tabular-nums keeps digits the same width so columns line up down the page. */
.num{text-align:right;font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--positive-700)}
.neg{color:var(--negative-500)}
.cur{background:rgba(159,190,28,.14)}
.cur td{background:color-mix(in srgb, var(--accent-fill) 14%, transparent) !important}
.cur td:first-child::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-fill)}
.curtag{font-family:var(--font-body);font-size:var(--t-xs);font-weight:700;
  color:var(--accent);letter-spacing:.03em;margin-left:6px}
.hit{color:var(--positive-700);font-weight:700}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px;margin-bottom:18px}
.chartbox h4{margin:0 0 12px;font-family:var(--font-display);font-size:var(--t-md)}
.chartbox .cwrap{position:relative;height:300px}

.rlist{display:flex;flex-direction:column;gap:12px}
.ritem{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:16px 18px;text-align:left;width:100%;}
.ritem:hover{border-color:var(--line-strong);}
.kind{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 9px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--line-strong);color:var(--ink-2)}
.ritem .ti{flex:1;min-width:0}
.ritem .ti b{display:block;font-size:var(--t-md);font-weight:700}
.ritem .ti span{font-size:var(--t-sm);color:var(--ink-3)}
.rbody{white-space:pre-wrap;font-size:var(--t-md);line-height:1.68;color:var(--ink);max-width:74ch}

.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:var(--t-md);
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-md)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
  background:var(--navy-800);color:#fff;padding:12px 20px;border-radius:999px;font-size:var(--t-base);
  font-weight:600;box-shadow:var(--shadow-float);transition:transform .22s;z-index:200;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}

@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--ink:#111;--ink-2:#333;--ink-3:#555;--line:#ccc}
  body{background:#fff;font-size:11.5pt}
  #boot,nav.tabs,nav.subtabs,.top-r,#toast,.noprint{display:none !important}
  #app{display:block !important;max-width:none;padding:0}
  header#top{padding:0 0 12pt;border-bottom:1.5pt solid #333;margin-bottom:16pt}
  .rbody{max-width:none;font-size:11.5pt;line-height:1.55}
  .card,.tbwrap,.chartbox{box-shadow:none;border:1pt solid #ccc;break-inside:avoid}
  thead th{position:static}
  @page{margin:16mm 15mm}
}
</style>
</head>
<body>

<div id="boot">
  <div class="spin"></div>
  <div id="bootTxt">Loading your portfolio&hellip;</div>
</div>

<div id="scene" aria-hidden="true"></div>
<div id="app">
  <header id="top">
    <img src="https://niadffxpxdohglcyagau.supabase.co/storage/v1/object/public/public-docs/ces_logo.png"
         alt="Commercial Energy Solutions" onerror="this.style.display='none'">
    <div class="co" id="coName">&mdash;<small>CES flex portal</small></div>
    <div class="top-r">
      <button class="gbtn" onclick="cxReload()">Refresh</button>
      <button class="gbtn" onclick="cxSignOut()">Sign out</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-baskets" aria-selected="true"  onclick="cxTab('baskets')">Baskets</button>
    <button role="tab" id="tab-reports" aria-selected="false" onclick="cxTab('reports')">Reports</button>
    <button role="tab" id="tab-curve"   aria-selected="false" onclick="cxTab('curve')">Market curve</button>
  </nav>

  <section id="v-baskets" role="tabpanel" aria-labelledby="tab-baskets"></section>
  <section id="v-reports" role="tabpanel" aria-labelledby="tab-reports" hidden></section>
  <section id="v-curve"   role="tabpanel" aria-labelledby="tab-curve"   hidden></section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CES Flex — client portal.

   NO LOGIN PAGE. flex.html is the single front door for staff and clients
   alike; it signs people in and bounces clients here. If this page is opened
   without a session it sends you straight back there, and signing out returns
   there too. Both pages share the ces-flex-auth storage key.

   Read-only by construction:
     · reads only flex_client_* views + flex_reports + own customers row
     · no insert / update / upsert / delete / rpc anywhere in this file
     · no .channel() / realtime / presence, and the flex-cursors topic is gated
       on is_flex_team() by an RLS policy, so broker cursors can neither appear

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// A percentage alone doesn't tell a client whether it is good. The word carries
// the meaning so it survives greyscale and colour-blindness; colour only backs
// it up. Thresholds are descriptive, not advice.
function coverLabel(p){
  if(p==null) return {t:'No forecast', c:'ink-3'};
  const v=+p*100;
  if(v>=99.5) return {t:'Fully covered',  c:'positive-700'};
  if(v>=66)   return {t:'Mostly covered', c:'positive-700'};
  if(v>=33)   return {t:'Part covered',   c:'ink-2'};
  if(v>0)     return {t:'Largely open',   c:'ink-2'};
  return {t:'Open', c:'ink-2'};
}
// Signed so the direction reads without colour.
function signed(v){
  if(v==null||v==='') return '<span>—</span>';
  const n=+v, s=(n>0?'+':n<0?'−':'')+'£'+Math.abs(Math.round(n)).toLocaleString('en-GB');
  return `<span class="${n>0?'pos':n<0?'neg':''}">${s}</span>`;
}

// hidden from screen readers so it is not read out as punctuation.

function monthKey(y,m){let yy=y,mm=m;while(mm<1){mm+=12;yy--;}while(mm>12){mm-=12;yy++;}
  return yy+'-'+String(mm).padStart(2,'0')+'-01';}
function nowMonth(){const d=new Date();return monthKey(d.getFullYear(),d.getMonth()+1);}
function nextMonth(){const d=new Date();return monthKey(d.getFullYear(),d.getMonth()+2);}
function fmtMonth(s){if(!s)return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'}).replace(' ','-');}
function fmtDate(s){if(!s)return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});}
function fmtLong(s){if(!s)return '—';
  return new Date(String(s).slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}

async function load(){
  const [bk,ps,tr,tg,st,cv,rp,me] = await Promise.all([
    CX.sb.from('flex_client_baskets').select('id,name,commodity,unit_vol,unit_price').order('name'),
    CX.sb.from('flex_client_positions').select('*').order('month'),
    CX.sb.from('flex_client_trades').select('*').order('trade_date'),
    CX.sb.from('flex_client_targets').select('*').order('month'),
    CX.sb.from('flex_client_sites').select('*').order('mpxn'),
    CX.sb.from('flex_client_curves').select('commodity,period_type,period_label,month,mid,updated_at'),
    CX.sb.from('flex_reports').select('id,kind,title,period_label,report_date,body')
         .eq('published',true).order('report_date',{ascending:false}),
    CX.sb.from('customers').select('customer_id,company_name').maybeSingle()
  ]);
  for(const r of [bk,ps,tr,tg,st,cv,rp]) if(r.error) throw new Error(r.error.message);

  D.baskets = bk.data||[];
  const by = (rows,key)=>{const o={};for(const r of (rows||[]))(o[r[key]] ??= []).push(r);return o;};
  D.positions = by(ps.data,'basket_id');
  D.trades    = by(tr.data,'basket_id');
  D.targets   = by(tg.data,'basket_id');
  D.sites     = by(st.data,'basket_id');

  const fwd = nextMonth();
  const grp=(f,t)=>(cv.data||[])
    .filter(c=>c.commodity===f&&c.period_type===t&&(t!=='month'||!c.month||String(c.month).slice(0,10)>=fwd))
    .map(c=>({label:c.period_label,month:c.month,mid:c.mid==null?null:+c.mid}));
  D.curve = {
    gas:  {months:grp('gas','month'),  quarters:grp('gas','quarter'),  seasons:grp('gas','season'),  annuals:grp('gas','annual')},
    power:{months:grp('power','month'),quarters:grp('power','quarter'),seasons:grp('power','season'),annuals:grp('power','annual')}
  };
  D.reports = rp.data||[];
  if(me.error) console.warn('company name unavailable:', me.error.message);
  CX.company = (me.data && me.data.company_name) || '';
}

/* ── Basket stats: the same eight figures the broker desk sees ───────────
   Mirrors renderDetailStats() in flex.html. Weighted averages, not simple
   means: WAP is weighted by secured volume, MtM price and delivered rate by
   baseload volume. A simple mean across months of unequal size is wrong and
   would quietly disagree with the desk's own number. */
function statsOf(rows, b){
  const isP = b.commodity === 'power';
  let base=0, sec=0, wapNum=0, wapDen=0, mtmNum=0, mtmDen=0,
      drNum=0, drDen=0, mtmCost=0, baseMW=0, secMW=0, openMW=0, openTot=0;
  for(const r of rows||[]){
    const bt=+(r.baseload_vol_total||0), st=+(r.secured_vol_total||0);
    base+=bt; sec+=st;
    baseMW+=+(r.baseload_vol||0); secMW+=+(r.secured_vol||0);
    openMW+=+(r.open_vol||0);     openTot+=+(r.open_vol_total||0);
    mtmCost+=+(r.mtm_cost||0);
    if(r.secured_wap!=null && st>0){ wapNum+=(+r.secured_wap)*st; wapDen+=st; }
    if(r.mtm_price!=null && bt>0){   mtmNum+=(+r.mtm_price)*bt;   mtmDen+=bt; }
    if(r.delivered_rate!=null && bt>0){ drNum+=(+r.delivered_rate)*bt; drDen+=bt; }
  }
  return {
    avgWap: wapDen? wapNum/wapDen : null,
    avgMtm: mtmDen? mtmNum/mtmDen : null,
    pct:    base?   sec/base      : null,
    baseCard: isP? baseMW : base,
    secCard:  isP? secMW  : sec,
    openCard: isP? openMW : openTot,
    avgDr:  drDen? drNum/drDen : null,
    mtmCost, base, sec, isP
  };
}

/* Filter state for the Positions tab, mirroring the desk's filter bar. */
let FLT = { season:'', from:'', to:'', hideHist:false };

function monthsOf(id){
  return (D.positions[id]||[]).slice().sort((a,b)=>String(a.month)<String(b.month)?-1:1);
}
function applyFilters(rows){
  const now = nowMonth();
  return rows.filter(r=>{
    const mk = String(r.month).slice(0,10);
    if(FLT.hideHist && mk < now) return false;
    if(FLT.season && r.season !== FLT.season) return false;
    if(FLT.from && mk < FLT.from) return false;
    if(FLT.to   && mk > FLT.to)   return false;
    return true;
  });
}

/* ── basket list ─────────────────────────────────────────────────────── */
// Forward cover = secured vs baseload from the current month on. Settled months
// are excluded: "how covered am I" means ahead, not behind.
function coverOf(rows){
  const from=nowMonth();
  let base=0,sec=0,wsum=0,mtm=0;
  for(const r of rows||[]){
    if(!r.month) continue;
    if(String(r.month).slice(0,10)<from) continue;
    const b=+(r.baseload_vol_total||0), s=+(r.secured_vol_total||0);
    base+=b; sec+=s;
    if(r.secured_wap!=null) wsum+=s*(+r.secured_wap);
    mtm+=+(r.mtm_cost||0);
  }
  return {base,sec,mtm,pct:base?sec/base:null,wap:sec?wsum/sec:null};
}

// Lowest tier not yet achieved: the next price this basket is trying to buy at.
function nextTarget(t){
  if(!t) return '—';
  const live=[];
  for(let i=1;i<=8;i++){
    const v=t['lower_t'+i], a=t['t'+i+'_achieved'];
    const hit=a!=null&&String(a).trim()!==''&&String(a).toLowerCase()!=='false';
    if(v!=null&&!hit) live.push(+v);
  }
  if(!live.length) return '<span class="hit">All hit ✓</span>';
  return n2(Math.max(...live));
}

function subSeasons(b,host){

  const isP=b.commodity==='power';
  const order=[],map={};

  host.innerHTML=`<div class="tbwrap"><table>
    <caption>Grouped by delivery season. Volumes in ${isP?'MWh':'therms'}; rates in ${esc(b.unit_price||'')}.</caption>

      <th scope="col" class="num">Forecast</th><th scope="col" class="num">Secured</th>

      <th scope="col" class="num">Secured cost</th><th scope="col" class="num">Mark to market</th>
    </tr></thead><tbody>${order.map(sn=>{
      const ms=map[sn].months;
      const base=ms.reduce((s,m)=>s+ +(m.baseload_vol_total||0),0);
      const sec =ms.reduce((s,m)=>s+ +(m.secured_vol_total||0),0);

/* ── Ambient scene ───────────────────────────────────────────────────────
   Turbines turning, stacks smoking, and the client's OWN forward hedge-cover
   line climbing across the horizon. Drawn as inline SVG from data already
   loaded, so it is specific to them rather than stock wallpaper, costs a few
   KB, and recolours with the theme.

   Everything sits behind opaque cards at low opacity. Motion stops under
   prefers-reduced-motion and whenever the tab is hidden. aria-hidden, because
   it carries nothing a screen reader needs. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function turbine(x, baseY, h, dur){
  const hubY = baseY - h, r = h * 0.58;
  const blade = a => {
    const rad = (a - 90) * Math.PI / 180;
    return `<line class="blade" x1="0" y1="0" x2="${(Math.cos(rad)*r).toFixed(1)}" y2="${(Math.sin(rad)*r).toFixed(1)}"/>`;
  };
  // SMIL rotate, not a CSS transform. transform-box:fill-box put the rotation
  // centre at the bounding-box centre of the three blades, which sits about a
  // quarter-radius BELOW the hub, so the rotor orbited away from the mast.
  // `from="0 0 0"` pins it to this group's own origin, which is the hub exactly.
  const spin = REDUCED ? '' :
    `<animateTransform attributeName="transform" attributeType="XML" type="rotate"
       from="0 0 0" to="360 0 0" dur="${dur}s" repeatCount="indefinite"/>`;
  return `<g transform="translate(${x},0)">
      <path class="mast" d="M0,${baseY} L0,${hubY}"/>
      <g transform="translate(0,${hubY})">
        <g>${spin}${blade(0)}${blade(120)}${blade(240)}</g>
        <circle class="hub" cx="0" cy="0" r="3.2"/>
      </g>
    </g>`;
}

function stack(x, baseY, h){
  const topY = baseY - h;
  // Six puffs on staggered delays, all born at the chimney mouth. The rise
  // keyframe drifts them right as they climb, so the column reads as smoke
  // leaving the stack rather than as circles appearing beside it.
  let puffs = '';
  const N = 6, dur = 11;
  for (let i = 0; i < N; i++){
    const jitter = ((i % 3) - 1) * 2.5;          // slight spread at the mouth
    puffs += `<circle class="puff" cx="${(x + jitter).toFixed(1)}" cy="${(topY - 4).toFixed(1)}"
      r="${(7 + (i % 3) * 2.5).toFixed(1)}"
      style="animation-delay:${(i * dur / N).toFixed(2)}s;animation-duration:${dur}s"/>`;
  }
  return `<g><path class="stack" d="M${x-11},${baseY} L${x-7},${topY} L${x+7},${topY} L${x+11},${baseY}"/>
    <path class="stack" d="M${x-9},${topY+7} L${x+9},${topY+7}"/>${puffs}</g>`;
}

function pylon(x, baseY, h){
  const t = baseY - h, w = h * 0.30;
  return `<g class="pylon">
    <path d="M${x-w},${baseY} L${x-w*0.30},${t} M${x+w},${baseY} L${x+w*0.30},${t}"/>
    <path d="M${x-w*0.72},${baseY-h*0.34} L${x+w*0.72},${baseY-h*0.34}
             M${x-w*0.50},${baseY-h*0.62} L${x+w*0.50},${baseY-h*0.62}"/>
    <path d="M${x-w*0.86},${baseY-h*0.50} L${x+w*0.86},${baseY-h*0.50}"/>
    <path d="M${x-w*0.62},${t+h*0.12} L${x+w*0.62},${t+h*0.12}"/>
  </g>`;
}

function drawScene(){
  const host = document.getElementById('scene'); if(!host) return;
  // Roomier viewBox so `slice` cropping on a wide window never reaches the
  // rotor tips. Content sits well inside the frame with headroom above.
  const W = 2000, H = 1120, HORIZON = 830;

  // The forward market curve for the commodities this client actually holds.
  // Drawn as candles: each body runs from last month's mid to this month's mid,
  // so every mark is real movement in their own curve. No synthetic OHLC.
  const from = nowMonth(), byM = {};
  for (const c of ['power','gas']){
    if (!D.baskets.some(b => b.commodity === c)) continue;
    for (const m of ((D.curve[c] || {}).months || [])){
      const mk = m.month ? String(m.month).slice(0,10) : null;
      if (!mk || mk < from || m.mid == null) continue;
      (byM[mk] ??= []).push(+m.mid);
    }
  }
  const keys = Object.keys(byM).sort().slice(0, 54);
  const mids = keys.map(k => byM[k].reduce((a,b)=>a+b,0) / byM[k].length);

  let chart = '';
  if (mids.length > 3){
    // Resample the real curve to a dense bar field. Linear interpolation of a
    // real series, not invented data: bar N sits between two genuine monthly
    // mids. Density is what makes the wave read as a wave rather than as a few
    // scattered blocks.
    const N = 150;
    const dense = [];
    for (let i = 0; i < N; i++){
      const t = (i / (N - 1)) * (mids.length - 1);
      const a = Math.floor(t), b = Math.min(mids.length - 1, a + 1), f = t - a;
      dense.push(mids[a] * (1 - f) + mids[b] * f);
    }

    const lo = Math.min(...dense), hi = Math.max(...dense), span = (hi - lo) || 1;
    const TOP = 220, BOT = HORIZON - 150;
    const y = v => BOT - ((v - lo) / span) * (BOT - TOP);
    const step = W / N;
    const bw = Math.max(4, step * 0.62);

    let bars = '', vol = '';
    for (let i = 0; i < N; i++){
      const open = i ? dense[i-1] : dense[i], close = dense[i];
      const x = step * (i + 0.5);
      const yO = y(open), yC = y(close);
      // Give every bar real presence: the body spans the move, with a minimum
      // so a flat stretch still shows as a bar rather than a hairline.
      const top = Math.min(yO, yC) - 9, h = Math.abs(yC - yO) + 18;
      const cls = close <= open ? 'cdl-dn' : 'cdl-up';
      bars += `<g class="cdl ${cls}" style="--i:${i}">`
            + `<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}"`
            + ` width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1"/></g>`;
      // Volume column along the floor, scaled by how far the curve moved.
      const mv = Math.abs(close - open);
      const vh = 8 + (mv / (span / mids.length * 2 || 1)) * 26;
      vol += `<g class="vol" style="--i:${i}">`
           + `<rect x="${(x-bw/2).toFixed(1)}" y="${(HORIZON - Math.min(vh,120)).toFixed(1)}"`
           + ` width="${bw.toFixed(1)}" height="${Math.min(vh,120).toFixed(1)}" rx="1"/></g>`;
    }

    const axes = [0.25,0.5,0.75].map(f=>{
      const yy = TOP + (BOT-TOP)*f;
      return `<line class="axis" x1="0" y1="${yy.toFixed(0)}" x2="${W}" y2="${yy.toFixed(0)}"/>`;
    }).join('');

    chart = axes + vol + bars;
  }

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <g class="grid">
      ${[190,370,550,730].map(v=>`<line x1="0" y1="${v}" x2="${W}" y2="${v}"/>`).join('')}
      ${[330,720,1110,1500,1890].map(v=>`<line x1="${v}" y1="0" x2="${v}" y2="${HORIZON}"/>`).join('')}
    </g>
    ${chart}
    ${stack(1452, HORIZON, 150)}${stack(1516, HORIZON, 172)}
    ${pylon(1030, HORIZON, 224)}
    ${turbine(268, HORIZON, 268, 7)}
    ${turbine(566, HORIZON, 200, 9.5)}
    ${turbine(772, HORIZON, 146, 12)}
    ${turbine(1762, HORIZON, 232, 8.4)}
    <path class="land" d="M0,${HORIZON} L${W},${HORIZON} L${W},${H} L0,${H} Z"/>
  </svg>`;
}

// Do not burn a laptop battery animating something nobody is looking at.
document.addEventListener('visibilitychange', () => {
  const h = document.getElementById('scene');
  if (h) h.classList.toggle('paused', document.hidden);
});

/* ── reports ─────────────────────────────────────────────────────────── */
function renderReports(){
  const el=document.getElementById('v-reports');
  if(!D.reports.length){el.innerHTML='<div class="empty">No reports have been published to your portal yet.</div>';return;}
  el.innerHTML=`<div class="rlist">${D.reports.map(r=>`
    <button class="ritem" data-report="${esc(r.id)}">
      <span class="kind">${esc(r.kind)}</span>
      <span class="ti"><b>${esc(r.title)}</b><span>${esc(r.period_label||fmtLong(r.report_date))}</span></span>
      <span style="color:var(--ink-3);display:flex">${ICON_CHEV}</span>
    </button>`).join('')}</div>`;
  el.querySelectorAll('[data-report]').forEach(b=>b.addEventListener('click',()=>openReport(b.dataset.report)));
}
function openReport(id){
  const r=D.reports.find(x=>x.id===id); if(!r) return;
  const el=document.getElementById('v-reports');
  el.innerHTML=`<button class="gbtn noprint" id="rBack" style="margin-bottom:18px">&larr; All reports</button>
    <article class="card">
      <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <span class="kind">${esc(r.kind)} report</span>
          <h2 style="font-size:var(--t-xl);margin:8px 0 4px">${esc(r.title)}</h2>
          <div style="font-size:var(--t-sm);color:var(--ink-3);font-weight:600">
            ${esc(r.period_label||'')}${r.period_label?' · ':''}${fmtLong(r.report_date)}</div>
        </div>
        <button class="gbtn noprint" id="rPdf">Download PDF</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <div class="rbody">${esc(r.body)}</div>
    </article>`;
  document.getElementById('rBack').addEventListener('click',renderReports);
  // Pasted text, so the browser's own PDF writer is the right tool: selectable
  // text, real pagination, nothing extra loaded into the page.
  document.getElementById('rPdf').addEventListener('click',()=>{
    toast('Choose "Save as PDF" in the print dialog'); setTimeout(()=>window.print(),500);});
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── market curve ────────────────────────────────────────────────────── */
function renderCurve(){
  const el=document.getElementById('v-curve');
  const have=[...new Set(D.baskets.map(b=>b.commodity))];
  const row=(label,rows)=>!rows||!rows.length?'':`
    <div class="tbwrap" style="margin-top:14px"><table>
      <thead><tr><th scope="col">${label}</th>${rows.map(r=>
        `<th scope="col" class="num">${esc(r.month?fmtMonth(r.month):r.label)}</th>`).join('')}</tr></thead>
      <tbody><tr><th scope="row">Mid</th>${rows.map(r=>`<td class="num">${n2(r.mid)}</td>`).join('')}</tr></tbody>
    </table></div>`;
  const block=(t,u,d)=>`<section class="card" style="margin-bottom:20px">
      <h3>${t} <span style="font-weight:600;color:var(--ink-3);font-size:var(--t-base)">(${u})</span></h3>
      ${row('Months',d.months)}${row('Quarters',d.quarters)}${row('Seasons',d.seasons)}${row('Annuals',d.annuals)}
    </section>`;
  el.innerHTML=(have.includes('power')?block('UK Power Forward Curve','£/MWh',D.curve.power):'')
    +(have.includes('gas')?block('NBP Gas Forward Curve','p/th',D.curve.gas):'')
    +`<p style="font-size:var(--t-sm);color:var(--ink-3);max-width:74ch">
        Indicative forward curve, upcoming months only. The current delivery month prices day-ahead
        and is not a forward period. Shown for information; it is not a tradeable quote.</p>`;
}
